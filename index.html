<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Tenant Manager | Modern Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                }
            }
        }
    </script>
</head>
<body class="h-full font-sans text-slate-100 bg-slate-950 selection:bg-indigo-500 selection:text-white">

    <!-- Auth Section (Ultra-Modern Glassmorphism Login) -->
    <div id="auth-section" class="flex min-h-full items-center justify-center px-4 py-12 sm:px-6 lg:px-8 relative overflow-hidden">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="w-full max-w-md space-y-8 bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl shadow-2xl relative z-10">
            <div class="text-center">
                <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 shadow-lg shadow-indigo-500/30 text-white text-2xl mb-4">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 id="auth-title" class="text-2xl font-bold tracking-tight text-white">Admin Authentication</h2>
                <p class="text-sm text-slate-400 mt-1">Sign in to manage tenants & properties</p>
            </div>

            <div class="space-y-5 mt-6">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500"><i class="fa-regular fa-envelope"></i></span>
                        <input type="email" id="email" placeholder="admin@example.com" class="w-full pl-11 pr-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500"><i class="fa-regular fa-lock"></i></span>
                        <input type="password" id="password" placeholder="••••••••" class="w-full pl-11 pr-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm">
                    </div>
                </div>

                <button onclick="handleAuth()" id="auth-btn" class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 text-sm">
                    Sign In to Dashboard
                </button>
            </div>

            <p class="text-center text-sm text-slate-400 mt-6">
                <span id="toggle-text">New administrator?</span>
                <button onclick="toggleAuthMode()" class="text-indigo-400 font-semibold hover:text-indigo-300 ml-1 transition" id="toggle-btn">Create account</button>
            </p>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="hidden min-h-full flex flex-col bg-slate-950">
        <!-- Premium Navbar -->
        <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-11 h-11 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-2xl flex items-center justify-center text-white text-xl shadow-lg shadow-indigo-600/30">
                        <i class="fa-solid fa-building"></i>
                    </div>
                    <div>
                        <span class="text-lg font-bold text-white tracking-tight block">NexusSpaces</span>
                        <span class="text-xs text-slate-400 font-medium">Tenant & Rental Intelligence</span>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="hidden sm:flex items-center space-x-2 bg-slate-900 border border-slate-800 px-3.5 py-2 rounded-xl">
                        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                        <span id="user-email" class="text-xs font-medium text-slate-300"></span>
                    </div>
                    <button onclick="logout()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 font-medium px-4 py-2 rounded-xl text-xs transition flex items-center space-x-2">
                        <i class="fa-solid fa-power-off"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Layout -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">
            
            <!-- Quick Stats Metrics -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Tenants</p>
                        <h4 id="stat-total" class="text-2xl font-bold text-white mt-1">0</h4>
                    </div>
                    <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-xl flex items-center justify-center text-xl border border-indigo-500/20">
                        <i class="fa-solid fa-users"></i>
                    </div>
                </div>
                <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Rent Value</p>
                        <h4 id="stat-revenue" class="text-2xl font-bold text-white mt-1">₹0</h4>
                    </div>
                    <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-xl border border-emerald-500/20">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                </div>
                <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Advance Paid</p>
                        <h4 id="stat-advance" class="text-2xl font-bold text-white mt-1">0</h4>
                    </div>
                    <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-xl flex items-center justify-center text-xl border border-amber-500/20">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
                
                <!-- Add Tenant Form Card -->
                <div class="bg-slate-900/60 border border-slate-800/80 rounded-3xl p-6 sm:p-7 shadow-xl backdrop-blur-md lg:col-span-1">
                    <div class="flex items-center space-x-3 mb-6">
                        <div class="p-2.5 bg-indigo-500/10 text-indigo-400 rounded-xl border border-indigo-500/20">
                            <i class="fa-solid fa-user-plus text-base"></i>
                        </div>
                        <h3 class="font-bold text-white text-base">Register New Tenant</h3>
                    </div>

                    <form id="tenant-form" onsubmit="addTenant(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Full Name</label>
                            <input type="text" id="t-name" placeholder="e.g. Rahul Sharma" required class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Aadhar Card No.</label>
                            <input type="text" id="t-aadhar" placeholder="xxxx xxxx xxxx" required class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Room No.</label>
                                <input type="text" id="t-room" placeholder="Room 101" required class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Rent (₹)</label>
                                <input type="number" id="t-rent" placeholder="5000" required class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Rent Due Date</label>
                            <input type="date" id="t-duedate" required class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500 transition text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Payment Status</label>
                            <select id="t-status" class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500 transition text-sm">
                                <option value="Due" class="bg-slate-900">Due / Pending</option>
                                <option value="Advance" class="bg-slate-900">Advance Paid</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">WhatsApp Mobile No.</label>
                            <input type="text" id="t-phone" placeholder="919876543210" required class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition text-sm">
                        </div>
                        <button type="submit" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/25 transition text-sm mt-2">
                            <i class="fa-solid fa-floppy-disk mr-2"></i> Save Tenant Record
                        </button>
                    </form>
                </div>

                <!-- Tenants Table Workspace -->
                <div class="bg-slate-900/60 border border-slate-800/80 rounded-3xl shadow-xl backdrop-blur-md overflow-hidden lg:col-span-2">
                    <div class="px-6 py-5 border-b border-slate-800 flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="p-2.5 bg-violet-500/10 text-violet-400 rounded-xl border border-violet-500/20">
                                <i class="fa-solid fa-list-check text-base"></i>
                            </div>
                            <h3 class="font-bold text-white text-base">Active Tenants Directory</h3>
                        </div>
                        <button onclick="loadTenants()" class="text-slate-400 hover:text-white text-xs font-semibold flex items-center space-x-1.5 bg-slate-800/50 hover:bg-slate-800 px-3 py-2 rounded-xl transition border border-slate-700/50">
                            <i class="fa-solid fa-rotate"></i>
                            <span>Refresh</span>
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-950/40 text-slate-400 uppercase text-[11px] tracking-wider border-b border-slate-800">
                                    <th class="py-4 px-6 font-semibold">Room</th>
                                    <th class="py-4 px-6 font-semibold">Tenant Info</th>
                                    <th class="py-4 px-6 font-semibold">Aadhar</th>
                                    <th class="py-4 px-6 font-semibold">Rent</th>
                                    <th class="py-4 px-6 font-semibold">Due Date / Status</th>
                                    <th class="py-4 px-6 font-semibold text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tenant-list" class="divide-y divide-slate-800/60 text-slate-300 text-sm">
                                <!-- Dynamic Render rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase API Script Logic (Direct - No Setup Required!) -->
    <script>
        // 🔑 BAS YAHAN APNI FIREBASE CONFIG DETAILS BADLEIN:
        const API_KEY = "AIzaSyAQXIiFPpZ2-VpoEHWK7lyayjJuxA58FPE";
        const PROJECT_ID = "kiraedar-manager";

        let userToken = localStorage.getItem('user_token') || null;
        let currentUserEmail = localStorage.getItem('user_email') || null;
        let isSignUp = false;

        // Check login status on page load
        window.onload = () => {
            if (userToken) {
                showDashboard();
            } else {
                showAuth();
            }
        };

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "Register Administrator" : "Admin Authentication";
            document.getElementById('auth-btn').innerText = isSignUp ? "Create Account & Sign In" : "Sign In to Dashboard";
            document.getElementById('toggle-text').innerText = isSignUp ? "Already registered?" : "New administrator?";
            document.getElementById('toggle-btn').innerText = isSignUp ? "Sign in" : "Create account";
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if(!email || !password) {
                alert("Please fill in email and password.");
                return;
            }

            const endpoint = isSignUp 
                ? `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`
                : `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`;

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, returnSecureToken: true })
                });

                const data = await res.json();
                if (data.error) {
                    alert("Auth Error: " + data.error.message);
                } else {
                    userToken = data.idToken;
                    currentUserEmail = data.email;
                    localStorage.setItem('user_token', userToken);
                    localStorage.setItem('user_email', currentUserEmail);
                    showDashboard();
                }
            } catch (err) {
                alert("Connection failed: " + err.message);
            }
        }

        function logout() {
            localStorage.removeItem('user_token');
            localStorage.removeItem('user_email');
            userToken = null;
            currentUserEmail = null;
            showAuth();
        }

        function showAuth() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-email').innerText = currentUserEmail;
            loadTenants();
        }

        // Add Tenant
// Add Tenant
        async function addTenant(e) {
            e.preventDefault();
            const name = document.getElementById('t-name').value;
            const aadhar = document.getElementById('t-aadhar').value;
            const room = document.getElementById('t-room').value;
            const rent = document.getElementById('t-rent').value;
            const dueDate = document.getElementById('t-duedate').value;
            const status = document.getElementById('t-status').value;
            const phone = document.getElementById('t-phone').value;

            const firestoreUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/tenants`;

            const body = {
                fields: {
                    name: { stringValue: name },
                    aadhar: { stringValue: aadhar },
                    room: { stringValue: room },
                    rent: { integerValue: Number(rent) },
                    dueDate: { stringValue: dueDate },
                    status: { stringValue: status },
                    phone: { stringValue: phone }
                }
            };

            try {
                const res = await fetch(firestoreUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userToken}` // 👈 Yeh line zaroori hai
                    },
                    body: JSON.stringify(body)
                });
                if(res.ok) {
                    document.getElementById('tenant-form').reset();
                    loadTenants();
                } else {
                    const errData = await res.json();
                    alert("Error saving record: " + JSON.stringify(errData));
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        // Load Tenants
        async function loadTenants() {
            const tbody = document.getElementById('tenant-list');
            tbody.innerHTML = `<tr><td colspan='6' class='py-10 text-center text-slate-500'><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading records...</td></tr>`;

            const firestoreUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/tenants`;

            try {
                const res = await fetch(firestoreUrl, {
                    headers: {
                        'Authorization': `Bearer ${userToken}` // 👈 Token passed here too
                    }
                });
                const data = await res.json();
                tbody.innerHTML = "";

                if (!data.documents || data.documents.length === 0) {
                    tbody.innerHTML = `<tr><td colspan='6' class='py-12 text-center text-slate-500 font-medium'>No tenant records found.</td></tr>`;
                    document.getElementById('stat-total').innerText = "0";
                    document.getElementById('stat-revenue').innerText = "₹0";
                    document.getElementById('stat-advance').innerText = "0";
                    return;
                }

                let totalCount = 0;
                let totalRevenue = 0;
                let advanceCount = 0;

                data.documents.forEach((doc) => {
                    const docId = doc.name.split('/').pop();
                    const fields = doc.fields;

                    const name = fields.name ? fields.name.stringValue : '';
                    const aadhar = fields.aadhar ? fields.aadhar.stringValue : '';
                    const room = fields.room ? fields.room.stringValue : '';
                    const rent = fields.rent ? (fields.rent.integerValue || fields.rent.stringValue) : 0;
                    const dueDate = fields.dueDate ? fields.dueDate.stringValue : '';
                    const status = fields.status ? fields.status.stringValue : 'Due';
                    const phone = fields.phone ? fields.phone.stringValue : '';

                    totalCount++;
                    totalRevenue += Number(rent);
                    if(status === 'Advance') advanceCount++;

                    const dueDisplay = status === 'Advance' 
                        ? `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><i class="fa-solid fa-circle-check mr-1.5 text-[10px]"></i> Advance Paid (No Due)</span>` 
                        : `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20"><i class="fa-solid fa-clock mr-1.5 text-[10px]"></i> Due: ${dueDate}</span>`;

                    const row = `
                        <tr class="hover:bg-slate-900/40 transition">
                            <td class="py-4 px-6 font-bold text-white">${room}</td>
                            <td class="py-4 px-6">
                                <div class="font-semibold text-white">${name}</div>
                                <div class="text-xs text-slate-400"><i class="fa-regular fa-phone mr-1"></i>${phone}</div>
                            </td>
                            <td class="py-4 px-6 font-mono text-xs text-slate-400">${aadhar}</td>
                            <td class="py-4 px-6 font-semibold text-white">₹${rent}</td>
                            <td class="py-4 px-6">${dueDisplay}</td>
                            <td class="py-4 px-6 text-center space-x-1.5">
                                <a href="https://wa.me/${phone}?text=Hello%20${encodeURIComponent(name)},%20aapka%20room%20no%20${encodeURIComponent(room)}%20ka%20rent%20₹${rent}%20due%20hai.%20Kripya%20jald%20pay%20karein." target="_blank" title="WhatsApp Reminder" class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500 hover:text-white transition border border-emerald-500/20">
                                    <i class="fa-brands fa-whatsapp text-sm"></i>
                                </a>
                                <button onclick="toggleStatus('${docId}', '${status}', '${name}', '${aadhar}', '${room}', '${rent}', '${dueDate}', '${phone}')" title="Toggle Status" class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-amber-500/10 text-amber-400 hover:bg-amber-500 hover:text-white transition border border-amber-500/20">
                                    <i class="fa-solid fa-rotate-right text-xs"></i>
                                </button>
                                <button onclick="deleteTenant('${docId}')" title="Delete Tenant" class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white transition border border-rose-500/20">
                                    <i class="fa-regular fa-trash-can text-xs"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

                document.getElementById('stat-total').innerText = totalCount;
                document.getElementById('stat-revenue').innerText = "₹" + totalRevenue.toLocaleString('en-IN');
                document.getElementById('stat-advance').innerText = advanceCount;

            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan='6' class='py-10 text-center text-rose-400'>Error loading records.</td></tr>`;
            }
        }

        // Toggle Advance/Due
        async function toggleStatus(docId, currentStatus, name, aadhar, room, rent, dueDate, phone) {
            const newStatus = currentStatus === 'Advance' ? 'Due' : 'Advance';
            const firestoreUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/tenants/${docId}`;

            const body = {
                fields: {
                    name: { stringValue: name },
                    aadhar: { stringValue: aadhar },
                    room: { stringValue: room },
                    rent: { integerValue: Number(rent) },
                    dueDate: { stringValue: dueDate },
                    status: { stringValue: newStatus },
                    phone: { stringValue: phone }
                }
            };

            try {
                await fetch(firestoreUrl, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userToken}` 
                    },
                    body: JSON.stringify(body)
                });
                loadTenants();
            } catch (err) {
                alert("Error updating status: " + err.message);
            }
        }

        // Delete Tenant
        async function deleteTenant(docId) {
            if (confirm("Are you sure you want to delete this tenant record?")) {
                const firestoreUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/tenants/${docId}`;
                try {
                    await fetch(firestoreUrl, { 
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${userToken}`
                        }
                    });
                    loadTenants();
                } catch (err) {
                    alert("Error deleting: " + err.message);
